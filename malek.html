async function fx(){

 let u=src;try{u=await blob(src)}catch{}
 if(!ok())return;

 const D=v.duration;if(!ok()||!D)return;
 const fine=matchMedia('(pointer:fine)').matches,E=D-.06,N=Math.min(120,Math.round(D*12));let J,W,H;
 if(FC[src])({J,W,H}=FC[src]);
 else{
  const seek=t=>new Promise(r=>{v.addEventListener('seeked',r,{once:true});v.currentTime=t;setTimeout(r,700)});

 cv.width=W;cv.height=H;const x=cv.getContext('2d'),B={},R={};

 const around=c=>{for(let i=Math.max(0,c-4);i<=Math.min(N-1,c+10);i++)want(i);for(const k in R)if(k<c-16||k>c+22){R[k].close();delete R[k];delete B[k]}};

 if(!ok())return;
 draw(0);cv.style.opacity=1;ph.remove();
 const f=$('#film');f.style.height=Math.min(800,Math.max(350,D*45))+'vh';
 let vt=0,idle=0,shown=1,last=-1,top=0,span=1;
 const m=()=>{top=f.offsetTop;span=Math.max(1,f.offsetHeight-innerHeight)};m();addEventListener('resize',m);
 const pg=$('#pg'),ov=$('#ov2'),hide=()=>{cv.style.transition='opacity .2s';cv.style.opacity=0;shown=0};
 if(fine)v.addEventListener('seeked',()=>{if(idle>=5&&shown)hide()});
 const loop=()=>{if(!ok()){for(const k in R)R[k].close();return}
  const p=Math.min(1,Math.max(0,(scrollY-top)/span)),t=p*E;
  vt+=(t-vt)*.14;
  pg.style.transform=`scaleX(${p})`;ov.style.opacity=1-Math.min(1,p*8);
  if(Math.abs(t-vt)>.002){idle=0;if(!shown){cv.style.transition='none';cv.style.opacity=1;shown=1}if(Math.abs(vt-last)>.0005){draw(vt);last=vt}}
  else if(fine){idle++;if(idle>=5&&!v.seeking){if(Math.abs(v.currentTime-vt)>.012)v.currentTime=vt;else if(shown)hide()}}
  raf=requestAnimationFrame(loop)};
 loop();
}
function info(a){
 const s=$('#info');if(!s)return;const l=a.location||{},m=mapUrl(a),t=taken(a);
 const st=[['Bedrooms',a.bedrooms],['Bathrooms',a.bathrooms],['Area',a.area!=null?a.area+' m²':null],['Floor',a.floor],['Location',l.address]].map(([k,v])=>v!=null&&v!==''?`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`:'').join('');
 s.innerHTML=`<div class="wrap"><div class="ih"><div><h2>${esc(a.name)}</h2><span class="id">${a.id}</span></div><div class="pr"><span>${pHtml(a)}</span><span class="bd ${t?'t':'v'}">${t?'Taken':'Available'}</span></div></div>
 <dl class="st">${st}</dl><p class="ds">${esc(a.description)}</p>
 ${(a.facilities||[]).length?`<div class="fc">${a.facilities.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`:''}
 ${(a.gallery||[]).length?`<div class="gl">${a.gallery.map(g=>`<img loading="lazy" src="${esc(ik(g,800))}" alt="">`).join('')}</div>`:''}
 <div class="bt">${m?`<a class="b2" target="_blank" rel="noopener" href="${esc(m)}">View on map</a>`:''}${t?`<button class="b1" disabled>THIS APARTMENT IS TAKEN</button>`:`<a class="b1" target="_blank" rel="noopener" href="${wa(a)}">Reserve this apartment</a>`}</div></div>`;
}
// ---- events ----
document.addEventListener('click',e=>{
 const b=e.target.closest('#nav button,#top [data-k]');if(!b)return;
 const k=b.dataset.k;
 if(cur!=='home'){pend=k;location.hash='#home'}else go(k);
});
function go(k){const t=k==='home'?0:$('#'+k).offsetTop-96;scrollTo({top:t})}

const pre=e=>{const c=e.target.closest('.ap'),a=c&&get(c.getAttribute('href').slice(2));if(a?.videoUrl)blob(a.videoUrl).catch(()=>{})};
document.addEventListener('mouseover',pre);document.addEventListener('touchstart',pre,{passive:true});
// ---- router + nav ----
function refresh(){if(cur==='home')cards();else if(cur==='show'){const a=get(location.hash.slice(2));if(a&&$('#info'))info(a);else showcase(location.hash.slice(2))}}
function route(){
 const h=location.hash;
 if(h.startsWith('#/')){cur='show';showcase(h.slice(2))}
 else{cur='home';home()}
 sec=cur==='home'?'home':sec;
 if(pend&&cur==='home'){const k=pend;pend=null;requestAnimationFrame(()=>go(k))}else scrollTo({top:0,behavior:'instant'});
 nav();
}
function nav(){
 document.body.dataset.v=cur;
 const nv=$('#nav'),vis=[...nv.querySelectorAll('button')].filter(b=>!b.hidden);
 const k=cur==='show'?'home':sec;
 vis.forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 document.querySelectorAll('#top .lk [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 nv.style.setProperty('--n',vis.length);nv.style.setProperty('--i',Math.max(0,vis.findIndex(b=>b.dataset.k===k)));
}
let tick=0;
addEventListener('scroll',()=>{if(tick)return;tick=requestAnimationFrame(()=>{tick=0;
 if(cur==='home'&&$('#contact')){const y=scrollY+innerHeight*.4,s=y>=$('#contact').offsetTop||innerHeight+scrollY>=document.documentElement.scrollHeight-4?'contact':'home';if(s!==sec){sec=s;nav()}}
})},{passive:true});
addEventListener('hashchange',route);
route();
