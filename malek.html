<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Malek Homes – Premium apartments for rent</title>
<meta name="description" content="Malek Homes: apartments owned by Malek, available for rent with immersive video tours, live availability and direct contact with the owner.">
<meta name="theme-color" content="#173F35">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23173F35'/%3E%3Cpath d='M7 16.5L16 8l9 8.5M10 15v9h12v-9' fill='none' stroke='%23C6A66B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://ik.imagekit.io" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{--fg:#173F35;--fg2:#0E2B24;--fg3:#1F5245;--iv:#F7F5F0;--iv2:#EEEAE0;--au:#C6A66B;--au2:#DDC595;--aud:#8A6D36;--tx:#202521;--mt:#626964;--ln:rgba(23,63,53,.12);--ok:#1B6B4F;--r:28px;
--sh1:0 1px 2px rgba(14,43,36,.05),0 10px 28px rgba(14,43,36,.08);--sh2:0 2px 4px rgba(14,43,36,.06),0 26px 56px rgba(14,43,36,.18);
--ease:cubic-bezier(.22,.8,.24,1);--sa:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
--dp:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;--sn:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:500 16px/1.6 var(--sn);color:var(--tx);background:var(--iv);-webkit-font-smoothing:antialiased;overflow-x:clip;padding-bottom:calc(96px + var(--sa))}
body.nsc{overflow:hidden}
img,video,canvas,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
ul{list-style:none;padding:0}
::selection{background:rgba(198,166,107,.4)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--au);outline-offset:3px;border-radius:12px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:block;animation:fi .5s ease both}
@keyframes fi{from{opacity:0}}

/* ---------- reveal ---------- */
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0ms)}
.js .rv.in{opacity:1;transform:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font:700 15px/1 var(--sn);transition:transform .35s var(--ease),background .3s,box-shadow .3s,color .3s;-webkit-user-select:none;user-select:none;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn-g{background:var(--au);color:#1b2a24;box-shadow:0 8px 24px rgba(198,166,107,.35)}
.btn-g:hover{background:#d4b87f}
.btn-o{border:1px solid rgba(247,245,240,.38);color:#fff;background:rgba(255,255,255,.07)}
.btn-o:hover{background:rgba(255,255,255,.14)}
.btn-l{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-l:hover{background:rgba(255,255,255,.2)}
.btn-d{background:var(--fg);color:#fff}
.btn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.55);cursor:not-allowed;transform:none;box-shadow:none;border:1px dashed rgba(255,255,255,.25)}
.eb{display:inline-flex;align-items:center;gap:10px;font:700 12px/1 var(--sn);letter-spacing:.22em;text-transform:uppercase;color:var(--au2)}
.eb:before{content:"";width:28px;height:1px;background:currentColor}
.eb.d{color:var(--aud)}

/* ---------- top navigation ---------- */
#top{position:fixed;z-index:60;top:calc(12px + var(--st));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),1240px);height:64px;padding:0 9px 0 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-radius:999px;background:rgba(247,245,240,.86);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(23,63,53,.1);box-shadow:0 10px 30px rgba(14,43,36,.14)}
#top .l{display:flex;align-items:center;gap:10px;min-width:0}
.br{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.br .lg{width:38px;height:38px;border-radius:13px;background:var(--fg);display:grid;place-items:center;flex:none;color:var(--au)}
.br .lg svg{width:22px;height:22px}
.br span{font:700 23px/1 var(--dp);letter-spacing:.01em;color:var(--fg)}
.br span b{color:var(--aud);font-weight:700}
.bk{display:none;align-items:center;gap:6px;height:42px;padding:0 16px 0 10px;border-radius:999px;background:rgba(23,63,53,.07);font:700 13.5px var(--sn);color:var(--fg);transition:background .3s;white-space:nowrap}
.bk:hover{background:rgba(23,63,53,.13)}
body[data-v=show] .bk{display:inline-flex}
.lk{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(23,63,53,.06)}
.lk button{position:relative;z-index:1;height:40px;padding:0 22px;border-radius:999px;font:700 14px var(--sn);color:var(--tx);transition:color .35s}
.lk button.on{color:#fff}
.ind{position:absolute;z-index:0;left:0;top:4px;height:40px;width:0;border-radius:999px;background:var(--fg);opacity:0;transition:transform .5s var(--ease),width .5s var(--ease),opacity .3s}
.ac{display:flex;gap:8px;justify-content:flex-end}
.ac a{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font:700 14px/1 var(--sn);white-space:nowrap;transition:transform .3s var(--ease),background .3s}
.ac a:hover{transform:translateY(-1px)}
.ac .cl{background:rgba(23,63,53,.07);color:var(--fg)}
.ac .cl:hover{background:rgba(23,63,53,.13)}
.ac .wa{background:var(--fg);color:#fff}
.ac .wa:hover{background:var(--fg3)}

/* ---------- bottom navigation (phones/tablets) ---------- */
#nav{position:fixed;left:50%;bottom:calc(12px + var(--sa));transform:translateX(-50%);width:min(calc(100% - 24px),440px);height:68px;padding:6px;z-index:55;display:flex;border-radius:999px;background:rgba(247,245,240,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(23,63,53,.1);box-shadow:0 12px 34px rgba(14,43,36,.2);--i:0}
#bub{position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;background:var(--fg);transform:translateX(0);transition:transform .5s var(--ease),width .5s var(--ease);box-shadow:0 6px 16px rgba(23,63,53,.35)}
#nav .it{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px/1 var(--sn);color:var(--mt);border-radius:999px;transition:color .3s;-webkit-user-select:none;user-select:none}
#nav .it svg{width:22px;height:22px}
#nav .it.on{color:#fff}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:var(--fg2);overflow:hidden;isolation:isolate;padding:calc(120px + var(--st)) 0 88px}
.hero .art{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,43,36,.3) 0%,rgba(14,43,36,.05) 34%,rgba(14,43,36,.9) 100%)}
.hc{max-width:780px}
.hero h1{font:600 clamp(48px,10vw,108px)/.93 var(--dp);letter-spacing:-.02em;margin:20px 0 22px}
.hero h1 em{font-style:italic;font-weight:500;color:var(--au2)}
.hero .lead{font-size:clamp(16px,1.6vw,19px);color:rgba(247,245,240,.82);max-width:50ch}
.hb{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hf{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:40px;font:600 13.5px var(--sn);color:rgba(247,245,240,.78)}
.hf li{display:inline-flex;align-items:center;gap:9px}
.hf .ic{color:var(--au);width:19px;height:19px}
.cue{position:absolute;left:50%;bottom:54px;width:26px;height:42px;margin-left:-13px;border:1.5px solid rgba(247,245,240,.5);border-radius:14px;display:none}
.cue:after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:3px;background:var(--au2);animation:cue 1.9s ease-in-out infinite}
@keyframes cue{0%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}100%{opacity:0}}
@media(min-width:900px) and (min-height:720px){.cue{display:block}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:1}}
.hero .gl1,.hero .gl2,.hero .gl3{animation:glow 5s ease-in-out infinite}
.hero .gl2{animation-delay:1.6s}.hero .gl3{animation-delay:3.1s}

/* ---------- apartments section ---------- */
.apts{position:relative;z-index:1;background:var(--iv);border-radius:36px 36px 0 0;margin-top:-36px;padding:clamp(56px,8vw,104px) 0 clamp(48px,7vw,96px)}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px;margin-bottom:clamp(28px,4vw,52px)}
.sh h2{font:600 clamp(36px,5.6vw,64px)/1 var(--dp);letter-spacing:-.015em;color:var(--fg);margin-top:16px;max-width:15ch}
.sh p{color:var(--mt);max-width:40ch;font-weight:600;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),440px));justify-content:center;gap:clamp(16px,2.4vw,32px)}

.ap{container-type:inline-size;position:relative;display:flex;flex-direction:column;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1);transition:transform .55s var(--ease),box-shadow .55s var(--ease),opacity .8s var(--ease);isolation:isolate;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ap:active{transform:scale(.988)}
.md{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,var(--fg3),var(--fg2));overflow:hidden}
.md img,.md video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.3s var(--ease),opacity .7s,filter .5s}
.md video{opacity:0}.md video.rd{opacity:1}
.md:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,43,36,.4) 0%,transparent 30%,transparent 62%,rgba(14,43,36,.5) 100%);pointer-events:none}
.ph0{position:absolute;inset:0;display:grid;place-items:center;color:rgba(198,166,107,.5)}
.ph0 svg{width:60px;height:60px;stroke-width:1.2}
.ap.tk .md img,.ap.tk .md video{filter:grayscale(.8) brightness(.93)}
.bd{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:999px;font:700 12.5px/1 var(--sn);white-space:nowrap}
.bd i{width:8px;height:8px;border-radius:50%;flex:none}
.bd.v{background:rgba(27,107,79,.94);color:#fff}
.bd.v i{background:#7EF0B7;animation:pu 2.2s ease-out infinite}
.bd.t{background:rgba(236,233,225,.94);color:#5b625d}
.bd.t i{background:#9aa09b}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(126,240,183,.7)}80%,100%{box-shadow:0 0 0 8px rgba(126,240,183,0)}}
.md .bd{position:absolute;z-index:2;top:16px;left:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.idc{position:absolute;z-index:2;top:16px;right:16px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:700 11.5px/1 var(--sn);letter-spacing:.08em;border:1px solid rgba(255,255,255,.2)}
.bo{display:flex;flex-direction:column;gap:14px;padding:22px 24px 22px;flex:1;min-width:0}
.bo h3{font:600 clamp(28px,3.2vw,34px)/1.04 var(--dp);color:var(--fg);overflow-wrap:anywhere;letter-spacing:-.01em}
.lc{display:flex;align-items:center;gap:6px;color:var(--mt);font-size:14px;font-weight:600;margin-top:-6px;min-width:0}
.lc span{overflow-wrap:anywhere}
.lc .ic{color:var(--aud);width:17px;height:17px}
.sp{display:flex;flex-wrap:wrap;gap:8px}
.sp li{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--iv);font:600 13px/1 var(--sn)}
.sp .ic{color:var(--aud);width:17px;height:17px}
.ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--ln)}
.pp{display:flex;flex-direction:column;min-width:0}
.pp b{font:600 clamp(30px,3.4vw,36px)/1 var(--dp);color:var(--fg);letter-spacing:-.01em;overflow-wrap:anywhere}
.pp b.np{font-size:22px}
.pp small{font:600 12.5px var(--sn);color:var(--mt);margin-top:5px}
.go{display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 6px 0 20px;border-radius:999px;background:var(--fg);color:#fff;font:700 14px/1 var(--sn);white-space:nowrap;flex:none;transition:background .3s,gap .4s var(--ease)}
.go i{width:36px;height:36px;border-radius:50%;background:var(--au);color:#1b2a24;display:grid;place-items:center;transition:transform .5s var(--ease)}
.go i .ic{width:19px;height:19px}
.ap.tk .pp b{color:var(--mt)}
.ap.tk .go{background:#E7E3D9;color:var(--fg)}
.ap.tk .go i{background:#cfcabd}
@container (max-width:350px){.go{padding:0 6px}.go .tt{display:none}.bo{padding:20px 18px}}
@media(hover:hover){
 .ap:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
 .ap:hover .md img,.ap:hover .md video{transform:scale(1.06)}
 .ap:hover .go{background:var(--fg3);gap:16px}
 .ap:hover .go i{transform:translateX(2px) rotate(-45deg)}
 .ap.tk:hover .go{background:#dcd7c9}
}
/* skeleton */
.sk{display:block;background:linear-gradient(100deg,#ebe7dc 30%,#f8f5ec 50%,#ebe7dc 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.md .sk{position:absolute;inset:0;border-radius:0}
.sc .bo .sk{height:16px}.sc .l1{height:30px!important;width:62%}.sc .l2{width:40%}.sc .l3{width:80%;height:34px!important;border-radius:999px}.sc .ft .sk{height:40px!important;width:38%}.sc .ft .sk+.sk{width:42%;border-radius:999px}
.sc{pointer-events:none}

/* ---------- contact ---------- */
.ct{padding:0 0 clamp(40px,6vw,72px);background:var(--iv)}
.cp{position:relative;overflow:hidden;isolation:isolate;background:var(--fg);color:#fff;border-radius:36px;padding:clamp(28px,5vw,64px);display:grid;gap:clamp(24px,4vw,40px)}
.cp:before{content:"";position:absolute;z-index:-1;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(198,166,107,.28),transparent 68%)}
.cp h2{font:600 clamp(36px,5.2vw,60px)/1 var(--dp);letter-spacing:-.015em;margin:16px 0 14px}
.cp .lead{color:rgba(247,245,240,.74);max-width:40ch}
@media(min-width:900px){.cp{grid-template-columns:1fr 1.15fr;align-items:center}}
.cl2{display:grid;gap:12px}
.cc{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);transition:background .3s,transform .4s var(--ease)}
a.cc:hover{background:rgba(255,255,255,.13);transform:translateX(4px)}
.cc .ci{width:50px;height:50px;border-radius:16px;background:rgba(198,166,107,.18);color:var(--au2);display:grid;place-items:center;flex:none}
.cc .ci .ic{width:23px;height:23px}
.cc .tc{min-width:0;flex:1}
.cc small{display:block;font:700 11.5px/1.2 var(--sn);letter-spacing:.14em;text-transform:uppercase;color:rgba(247,245,240,.58);margin-bottom:5px}
.cc b{display:block;font:700 18px/1.3 var(--sn);overflow-wrap:anywhere}
.cc.loc{flex-wrap:wrap}
.cc.loc .btn{flex:1 0 100%;min-height:48px;margin-top:2px}
.fo{padding:26px 0 40px;color:var(--mt);font:600 13px var(--sn)}
.fo .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center}
.fo .br span{font-size:20px}
.fo .br .lg{width:32px;height:32px;border-radius:11px}

/* ---------- showcase ---------- */
.film{position:relative;background:var(--fg2);height:300vh}
.film.ld,.film.pl{height:100svh}
.film.nv{height:auto;min-height:72svh}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.film.nv .stage{position:relative;height:72svh}
.vw{position:relative;width:100%;height:100%;overflow:hidden;background:#0b211b;contain:layout paint}
.vw video,.vw canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cv{opacity:0;transform:translateZ(0)}
.side,.rail{display:none}
.ov2{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:0 24px calc(122px + var(--sa));pointer-events:none;color:#fff;background:linear-gradient(transparent 50%,rgba(14,43,36,.72))}
.ov2 h1{font:600 clamp(40px,12vw,76px)/.95 var(--dp);letter-spacing:-.015em;overflow-wrap:anywhere}
.cue2{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--sn);letter-spacing:.06em;color:rgba(255,255,255,.85)}
.cue2 .ic{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.lo{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;background:radial-gradient(120% 80% at 50% 30%,var(--fg3),var(--fg2));transition:opacity .7s}
.lo.out{opacity:0;pointer-events:none}
.lo h2{font:600 clamp(34px,8vw,52px)/1 var(--dp);overflow-wrap:anywhere;max-width:100%}
.lo p{font:600 14px var(--sn);color:rgba(247,245,240,.75)}
.ring{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.14);border-top-color:var(--au);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lb{width:min(220px,70%);height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.lb i{display:block;height:100%;width:100%;background:var(--au);transform:scaleX(.02);transform-origin:0 50%;transition:transform .3s}
.lk2{margin-top:6px;padding:11px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.28);font:700 13px var(--sn);color:#fff;opacity:0;animation:fi .6s 3s forwards;transition:background .3s}
.lk2:hover{background:rgba(255,255,255,.12)}
.mc{position:absolute;z-index:5;top:calc(80px + var(--st));right:14px;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:rgba(247,245,240,.9);color:var(--fg);font:700 13px var(--sn);box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform .3s var(--ease)}
.mc:hover{transform:translateY(-1px)}
.film.ld .mc{display:none}
.pe{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff;background:var(--fg2)}
.pe[hidden]{display:none}
.nvb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#fff;background:radial-gradient(120% 80% at 50% 30%,var(--fg3),var(--fg2))}
.nvb .ic{width:52px;height:52px;color:var(--au);stroke-width:1.2}
.nvb h1{font:600 clamp(36px,9vw,64px)/1 var(--dp)}
.pg{position:fixed;z-index:70;left:0;top:0;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,var(--au),var(--au2));pointer-events:none}
.film.ld~.pg,.film.pl~.pg,.film.nv~.pg{opacity:0}

@media(min-width:900px) and (min-aspect-ratio:7/10){

// The video is downloaded once (with progress) and cached for a short while so coming back is instant.
function blob(src,cb){
 if(BL.has(src))return Promise.resolve(BL.get(src));
 let p=PF.get(src);
 if(!p){
  const ctl=new AbortController();p={cbs:new Set(),pr:null};
  p.pr=(async()=>{
   const t=setTimeout(()=>ctl.abort(),90000);
   try{
    const r=await fetch(src,{signal:ctl.signal});if(!r.ok||!r.body)throw new Error('bad response');
    const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let n=0;
    for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;if(tot)p.cbs.forEach(f=>f(Math.min(1,n/tot)))}
    const u=URL.createObjectURL(new Blob(ch,{type:r.headers.get('content-type')||'video/mp4'}));
    lru(BL,src,u,3,(k,x)=>URL.revokeObjectURL(x));return u;
   }finally{clearTimeout(t);PF.delete(src)}
  })();
  PF.set(src,p);
 }
 if(cb)p.cbs.add(cb);
 return p.pr;
}

 if(!ok())return;if(have()<coarse.length)return bail('frames');

// ---------- events ----------
document.addEventListener('click',e=>{

 if(k){const key=k.dataset.k;if(cur!=='home'){pend=key;location.hash='#home'}else go(key);return}

  if(a==='retry'){if(noMod){banner('wait');setTimeout(()=>location.reload(),150)}else connect(true)}
  else if(a==='mode')setMode(mode==='play'?'scrub':'play',mode==='play'?'':'user');
  else if(a==='rv'){const pv=$('#pv'),pe=$('#pe');if(pv){const s=pv.src;pv.src='';pv.src=s;pv.play().catch(()=>{})}if(pe)pe.hidden=true}

   const c=el.querySelector('.cp')||el,r=c.getBoundingClientRect(),mob=getComputedStyle($('#nav')).display!=='none',t=84,bt=mob?96:24,room=innerHeight-t-bt;

// ---------- router + navigation ----------
function route(first){

 if(was==='home')hs=scrollY;
 runTear();g++;lbClose();

 if(h.startsWith('#/')){cur='show';cid=decodeURIComponent(h.slice(2));showcase(cid)}
 else{cur='home';sec='home';cid='';home();document.title='Malek Homes – Premium apartments for rent'}
 if(pend&&cur==='home'){const k=pend;pend=null;requestAnimationFrame(()=>go(k))}
 else scrollTo({top:cur==='home'&&was==='show'?hs:0,behavior:'instant'});

}

  const set=()=>{bub.style.width=ob.offsetWidth+'px';bub.style.height=ob.offsetHeight+'px';bub.style.top=ob.offsetTop+'px';bub.style.transform=`translateX(${ob.offsetLeft}px)`};
